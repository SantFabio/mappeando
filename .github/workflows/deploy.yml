name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Executa o workflow em pushes na branch main

permissions:
  contents: read # Permite leitura do repositório
  pages: write   # Permite publicar no GitHub Pages
  id-token: write # Necessário para autenticação OIDC

concurrency:
  group: pages             # Garante apenas um deploy do Pages por vez
  cancel-in-progress: true # Cancela execuções anteriores se houver uma nova

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build # Gera o dist com o base path configurado no vite.config.ts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # Só roda após o build finalizar

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
