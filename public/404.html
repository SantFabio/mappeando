<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Redirecionando...</title>
  <script>
    // Hack para SPA no GitHub Pages
    // O GitHub Pages serve este 404.html quando não encontra uma rota.
    // O script salva o path no sessionStorage e redireciona para o index.html,
    // que depois restaura o path no histórico do navegador.
    var pathSegmentsToKeep = 1; // 1 = mantém "/dynamic-prep-courses-map"
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>

<body>
</body>

</html>
